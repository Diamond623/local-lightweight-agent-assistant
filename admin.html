<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aurora · 账号管理</title><style>
:root{color-scheme:dark;--ink:#e7eef5;--muted:#a9bfd2;--accent:#b8d9cf;--line:#b5cfdf2b;--serif:"Iowan Old Style","Songti SC",Georgia,serif}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;min-height:100vh;min-height:100dvh;color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:linear-gradient(90deg,#060e1cbd,#070f1b50),url('/cosmic-field.png') center/cover fixed no-repeat,#081321;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer;min-height:40px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:#a8c6d613;color:#dbe7ee;transition:background .18s,border-color .18s}button:hover{background:#b2cfd824;border-color:#c2dcdd4d}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #b5dbcf;outline-offset:3px}p,small{color:var(--muted);line-height:1.8}.copyright{display:block;text-align:center;font-size:10px;color:#9ab0c6;line-height:1.8}.copyright span{white-space:nowrap}#feedback{min-height:22px;line-height:1.8;color:#efbfaf;font-size:12px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

main{max-width:1120px;margin:40px auto;padding:24px 30px}header{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:28px}header>div{display:flex;align-items:center;gap:9px;flex-wrap:wrap}h1{font:400 38px Georgia,serif;letter-spacing:-1px;margin:0}h1 small{font:12px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;letter-spacing:.6px;display:inline-block;padding-left:18px;margin-left:12px;border-left:1px solid #b5d0dc30}button,#backtochat{font-size:12px}#backtochat{display:inline-flex;align-items:center;min-height:40px;padding:10px 15px;border-radius:10px;border:1px solid #d0e2db45;text-decoration:none;white-space:nowrap;background:linear-gradient(135deg,#d0e4da,#bdcfe3);color:#172f39}#backtochat:hover{background:#dceae4}.panel{padding:25px 27px;background:#102033ef;border:1px solid #b3cadd28;border-radius:17px;margin:22px 0;overflow:auto;box-shadow:0 12px 35px #020a181c}.panel strong{font-size:16px;font-weight:500;color:#dfeced}.panel p{font-size:12px}.panel #toggle{background:#a2c8bd16;border-color:#b1d1c731}.panel button{margin:4px 6px 0 0}table{width:100%;border-collapse:collapse;white-space:nowrap}td,th{text-align:left;padding:16px 13px;border-bottom:1px solid #adc7dd1b;font-size:12px}th{font-size:11px;font-weight:500;color:#a9c3d3;background:#b0c9dc09}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#a4c3d209}td button{font-size:11px;min-height:32px;padding:7px 10px}.copyright{margin-top:30px}main>small:not(.copyright){font-size:11px}@media(max-width:700px){main{margin:16px auto;padding:17px 16px}header{flex-direction:column;align-items:flex-start;gap:20px}.panel{padding:19px 15px}h1{font-size:33px}h1 small{padding-left:12px;margin-left:8px}td,th{padding:13px 10px}}
</style><main><header><h1>Aurora <small>账号管理</small></h1><div><a id="backtochat" href="/">返回对话</a> <button id="logout">退出登录</button></div></header><p>管理使用 Aurora 的账号。这里不会展示密码或聊天内容。</p><div class="panel"><strong id="count"></strong><p id="registration"></p><button id="toggle">切换注册状态</button><button id="refresh">刷新列表</button></div><div id="feedback" role="status"></div><div class="panel"><table><thead><tr><th>账号 / 称呼</th><th>权限</th><th>状态</th><th>注册时间</th><th>最近登录</th><th>操作</th></tr></thead><tbody id="users"></tbody></table></div><small>停用会同时注销该账号全部登录。重新启用后，用户需要重新登录。管理员账号不能停用。</small><small class="copyright" aria-label="版权声明">© 2026 Aurora. <span>保留所有权利。</span></small></main><script>
const token='__TOKEN__',$=id=>document.getElementById(id);let registration=true;
async function api(action,obj={}){const r=await fetch('/api/auth/'+action,{method:'POST',headers:{'Content-Type':'application/json','X-Local-Token':token},body:JSON.stringify(obj)});const d=await r.json();if(!r.ok)throw Error(d.error||'操作失败');return d}
const date=n=>n?new Date(n*1000).toLocaleString('zh-CN'):'未记录';
async function refresh(){try{const data=await api('admin-list');registration=data.registration_open;$('count').textContent='共 '+data.users.length+' 个账号';$('registration').textContent=registration?'当前允许注册新账号':'当前已关闭新账号注册';$('toggle').textContent=registration?'关闭注册':'开放注册';$('users').replaceChildren();for(const user of data.users){const row=document.createElement('tr');for(const text of [user.username+' / '+user.display_name,user.owner?'管理员':'用户',user.disabled?'已停用':'正常',date(user.created),date(user.last_login)]){const cell=document.createElement('td');cell.textContent=text;row.append(cell)}const actions=document.createElement('td');const button=(text,fn)=>{const b=document.createElement('button');b.textContent=text;b.onclick=async()=>{b.disabled=true;try{await fn();await refresh()}catch(e){$('feedback').textContent=e.message}finally{b.disabled=false}};actions.append(b)};if(!user.owner)button(user.disabled?'启用':'停用',()=>api('admin-disable',{id:user.id,disabled:!user.disabled}));button('注销全部登录',()=>api('admin-revoke',{id:user.id}));row.append(actions);$('users').append(row)}}catch(e){$('feedback').textContent=e.message}}
$('toggle').onclick=async()=>{try{await api('admin-registration',{enabled:!registration});await refresh()}catch(e){$('feedback').textContent=e.message}};$('refresh').onclick=refresh;$('logout').onclick=async()=>{await api('logout');location.href='/'};refresh();
</script></html>
