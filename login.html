<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aurora · 登录</title><style>
:root{color-scheme:dark;--ink:#e7eef5;--muted:#a9bfd2;--accent:#b8d9cf;--line:#b5cfdf2b;--serif:"Iowan Old Style","Songti SC",Georgia,serif}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;min-height:100vh;min-height:100dvh;color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:linear-gradient(90deg,#060e1cbd,#070f1b50),url('/cosmic-field.png') center/cover fixed no-repeat,#081321;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer;min-height:40px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:#a8c6d613;color:#dbe7ee;transition:background .18s,border-color .18s}button:hover{background:#b2cfd824;border-color:#c2dcdd4d}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #b5dbcf;outline-offset:3px}p,small{color:var(--muted);line-height:1.8}.copyright{display:block;text-align:center;font-size:10px;color:#9ab0c6;line-height:1.8}.copyright span{white-space:nowrap}#feedback{min-height:22px;line-height:1.8;color:#efbfaf;font-size:12px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

body{display:grid;place-items:center;padding:32px 20px}.card{width:min(820px,100%);display:grid;grid-template-columns:.9fr 1.15fr;border:1px solid #b2ccd939;border-radius:24px;overflow:hidden;box-shadow:0 30px 100px #02091366;background:#101d2ef2}.login-identity{position:relative;display:flex;flex-direction:column;padding:43px 32px 36px;background:radial-gradient(ellipse at 40% 46%,#8ccdbc17,transparent 62%),linear-gradient(150deg,#15293dc9,#0d192cc7);border-right:1px solid #b1ced821;min-height:100%;isolation:isolate}.login-brand{display:flex;align-items:center;gap:11px}.login-brand svg{width:35px;height:32px;filter:saturate(.64);flex-shrink:0}.login-brand h1{font:400 38px Georgia,serif;letter-spacing:-1.2px;margin:0;color:#edf2f6}.tagline{font:400 15px/2 var(--serif);color:#bccfd7;letter-spacing:.7px;margin:auto 0 0;max-width:230px;padding-top:130px}.login-orbit{position:absolute;left:15%;right:15%;top:46%;height:84px;border:1px solid #b0d8df3d;border-radius:50%;transform:rotate(-26deg);pointer-events:none}.login-orbit:before,.login-orbit:after{content:'';position:absolute;border:1px solid #b3c8e732;border-radius:50%;inset:0;transform:rotate(54deg)}.login-orbit:after{inset:10px 20px;transform:rotate(-36deg);border-color:#a9d8c73b;box-shadow:0 0 48px 20px #96cbbb09}.login-fields{padding:42px 36px 26px}.login-fields h2{font:400 27px/1.5 var(--serif);letter-spacing:.7px;margin:0 0 27px;color:#edf1f5}label{display:block;margin:18px 0 8px;font-size:12px;color:#bbcddd}input:not([type=checkbox]){width:100%;min-height:45px;padding:12px 14px;border:1px solid #b0c9db30;border-radius:10px;background:#09152475;color:var(--ink);font:inherit}input::placeholder{color:#92a8bf;font-size:12px}input[type=checkbox]{accent-color:#b8d9cf;width:14px;height:14px;margin:0;flex-shrink:0}.check{font-size:10px;display:flex;align-items:center;gap:8px;line-height:1.8;margin:18px 0 0;color:#a5bbcf}.submit{width:100%;background:linear-gradient(135deg,#d1e6dc,#bed1e3);color:#18303b;border-color:#d3e7df4d;margin-top:22px}.submit:hover{background:#dfede9}.switch{width:100%;background:transparent;border:0;margin-top:9px;font-size:12px;color:#b9d1d5}.switch:hover{background:#aaccc712}#feedback{margin:7px 0}#note{display:block;font-size:10px;padding-top:15px;border-top:1px solid #b6cddb1c}.copyright{margin-top:18px;font-size:9px}
@media(max-width:640px){body{padding:20px 14px}.card{display:block;width:min(440px,100%);border-radius:20px}.login-identity{padding:28px 28px 23px;border-right:0;border-bottom:1px solid #b2cdd621}.login-brand h1{font-size:34px}.login-brand svg{width:30px;height:28px}.tagline{font-size:12px;margin:12px 0 0;padding:0;max-width:none}.login-orbit{display:none}.login-fields{padding:27px 28px 22px}.login-fields h2{font-size:24px;margin-bottom:23px}}
@media(prefers-reduced-transparency:reduce){.card,.login-identity{background:#111e2e}}
</style><main class="card"><section class="login-identity"><div class="login-brand"><svg viewBox="440 365 670 585" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><defs><linearGradient id="ag" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08b878"/><stop offset="1" stop-color="#22bbcf"/></linearGradient><linearGradient id="ab" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22cadb"/><stop offset="1" stop-color="#159af4"/></linearGradient><linearGradient id="ap" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#5267ee"/><stop offset="1" stop-color="#cd78d7"/></linearGradient></defs><path fill="url(#ag)" d="M716 930 C671 922 574 911 515 891 C480 879 447 808 462 785 C480 755 603 839 724 916 C735 925 726 932 716 930Z"/><path fill="url(#ag)" d="M730 900 C674 844 561 756 519 717 C499 698 517 674 539 648 C553 631 563 641 580 661 C640 734 703 806 737 873Z"/><path fill="url(#ab)" d="M751 849 C706 780 637 626 608 566 C591 536 613 527 630 513 C648 497 657 512 668 532 C711 613 749 729 773 825Z"/><path fill="url(#ab)" d="M793 818 C770 749 744 571 735 434 C732 414 744 408 770 392 C799 375 821 367 824 391 C823 477 801 676 810 817Z"/><path fill="#526cf0" d="M829 821 C821 721 834 610 880 511 C891 483 900 479 919 494 C940 512 968 527 955 558 C909 645 860 752 855 839Z"/><path fill="url(#ap)" d="M868 860 C876 772 947 678 986 638 C1011 610 1037 626 1027 658 C1012 706 941 756 908 851 C901 872 899 907 894 925 C887 941 884 906 881 892Z"/><path fill="url(#ap)" d="M909 915 C926 835 982 772 1062 757 C1111 745 1087 779 1074 797 C1048 827 994 824 925 922 C911 942 906 929 909 915Z"/></svg><h1>Aurora</h1></div><p class="tagline">给尚未发生的想法，一点极光。</p><div class="login-orbit" aria-hidden="true"></div></section><section class="login-fields"><h2 id="heading">欢迎回来</h2><form id="form"><label for="username">账号</label><input id="username" name="username" autocomplete="username" required minlength="3" maxlength="32" placeholder="英文、数字或下划线"><div id="namewrap" hidden><label for="name">怎么称呼你</label><input id="name" name="display_name" maxlength="20" autocomplete="nickname" placeholder="例如：小明"></div><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required minlength="10" maxlength="128" placeholder="至少 10 个字符"><label class="check"><input id="remember" type="checkbox" checked>记住登录 30 天（仅限自己的电脑）</label><button class="submit" id="submit">登录</button></form><button id="switch" class="switch">没有账号？创建一个</button><div id="feedback" role="status" aria-live="polite"></div><small id="note">各账号的聊天、记忆和任务分别保存。</small><small class="copyright" aria-label="版权声明">© 2026 Aurora. <span>保留所有权利。</span></small></section></main><script>
const token='__TOKEN__',$=id=>document.getElementById(id);let register=false,setup=false;
async function api(action,obj={}){const r=await fetch('/api/auth/'+action,{method:'POST',headers:{'Content-Type':'application/json','X-Local-Token':token},body:JSON.stringify(obj)});const d=await r.json();if(!r.ok||d.error)throw Error(d.error||'请求失败');return d}
function render(){ $('heading').textContent=register?(setup?'创建你的 Aurora 管理员账号':'创建账号'):'欢迎回来';$('namewrap').hidden=!register;$('name').required=register;$('password').autocomplete=register?'new-password':'current-password';$('submit').textContent=register?'创建并登录':'登录';$('switch').textContent=register?'已有账号？去登录':'没有账号？创建一个';$('switch').hidden=setup;$('note').textContent=setup?'第一个账号为本机管理员，将保留这台电脑原来的聊天、记忆和任务。请由电脑主人创建。':'各账号的聊天、记忆和任务分别保存。';$('feedback').textContent=''}
$('switch').onclick=()=>{register=!register;render()};$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;$('feedback').textContent='正在验证…';try{await api(register?'register':'login',{username:$('username').value,password:$('password').value,display_name:$('name').value,remember:$('remember').checked});location.reload()}catch(e){$('feedback').textContent=e.message}finally{$('submit').disabled=false}};
api('state').then(s=>{if(s.user){location.reload();return}setup=s.setup;register=setup;render()}).catch(e=>{$('feedback').textContent=e.message});
</script></html>
